<style>

    background:radial-gradient(circle at 12% 18%,rgba(255,255,255,.18) 0 60px,transparent 61px),radial-gradient(circle at 88% 30%,rgba(255,201,40,.28) 0 90px,transparent 91px),radial-gradient(circle at 20% 85%,rgba(255,79,139,.3) 0 110px,transparent 111px),radial-gradient(circle at 80% 90%,rgba(34,195,107,.28) 0 70px,transparent 71px),linear-gradient(135deg,#6a3df0 0%,#2d9cff 55%,#19d3ae 100%);background-attachment:fixed}

  .dots:after{content:"";animation:d 1.2s steps(4) infinite}@keyframes d{25%{content:"."}50%{content:".."}75%{content:"..."}}
  footer{text-align:center;font-size:13.5px;color:#fff;padding:14px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
  .shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  .cars{display:flex;gap:8px;flex-wrap:wrap}
  .cars button{font-size:28px;padding:6px 10px;background:#faf8ff;border:3px solid var(--line);box-shadow:none;border-radius:14px}
  .cars button.sel{border-color:var(--pink);background:#ffe9f1;transform:scale(1.12)}

  .chest{font-size:64px;padding:18px 0;background:linear-gradient(135deg,var(--yellow),var(--orange));box-shadow:0 7px 0 #c9781f;border-radius:22px;animation:bob 1.4s ease-in-out infinite}
  .chest:nth-child(2){animation-delay:.2s}.chest:nth-child(3){animation-delay:.4s}

  .chest:disabled:not(.open){opacity:.45;animation:none}
  @media(max-width:900px){main{grid-template-columns:1fr}}

<script>
(function(){
"use strict";
/* ===== Teacher setting =====
   Paste your Apps Script Web app link between the quotes (it ends with /exec).
   With the link: live race, shared road map, teacher dashboard and noise penalties.
   Left empty: the page works as single-player practice only.                     */
var API_URL = "https://script.google.com/macros/s/AKfycbywXMvtFFHmCGUOXtA2tJTQa-CUtn3nFqlc3licQhEwcPmK_Q63XRzgR2PBszHihHT8IA/exec";

/* ===== Mini Python engine: print( ), + - * /, brackets and stored variables ===== */
function pyEval(src,env){
  src=src.trim();
  var pm=/^print\s*\(([\s\S]*)\)$/.exec(src), printed=!!pm;
  if(pm)src=pm[1];
  var t=[],i=0,m,ids=[];
  while(i<src.length){
    var c=src[i];
    if(c===" "){i++;continue;}
    if((m=/^(\d+\.?\d*|\.\d+)/.exec(src.slice(i)))){t.push({k:"n",v:parseFloat(m[1]),f:m[1].indexOf(".")>=0});i+=m[1].length;continue;}
    if((m=/^[A-Za-z_]\w*/.exec(src.slice(i)))){
      if(m[0]==="print")throw "SyntaxError: use print( ) only once, around the whole calculation";
      if(!env||!(m[0] in env))throw "NameError: name '"+m[0]+"' is not defined";
      t.push({k:"n",v:env[m[0]],f:false});ids.push(m[0]);i+=m[0].length;continue;}
    var two=src.substr(i,2);
    if(two==="**"||two==="//"||c==="%")throw "This race uses only  +  -  *  /";
    if("+-*/()".indexOf(c)>=0){t.push({k:"o",v:c});i++;continue;}
    if(c==="×"||c==="÷")throw "SyntaxError: Python does not use '"+c+"'";
    if(c==='"'||c==="'")throw "No quotes needed – Python should calculate the answer";
    throw "SyntaxError: invalid character '"+c+"'";
  }
  if(!t.length)throw "Type your code first";
  var p=0;
  function peek(){return t[p]&&t[p].k==="o"?t[p].v:null;}
  function expr(){var a=term();while(peek()==="+"||peek()==="-"){var o=t[p++].v,b=term();a={v:o==="+"?a.v+b.v:a.v-b.v,f:a.f||b.f};}return a;}
  function term(){var a=un();while(peek()==="*"||peek()==="/"){var o=t[p++].v,b=un();
    if(o==="*")a={v:a.v*b.v,f:a.f||b.f};else{if(b.v===0)throw "ZeroDivisionError: division by zero";a={v:a.v/b.v,f:true};}}return a;}
  function un(){if(peek()==="-"){p++;var a=un();return{v:-a.v,f:a.f};}if(peek()==="+"){p++;return un();}return atom();}
  function atom(){var x=t[p];if(!x)throw "SyntaxError: incomplete code";
    if(x.k==="n"){p++;return x;}
    if(x.v==="("){p++;var a=expr();if(peek()!==")")throw "SyntaxError: missing )";p++;return a;}
    throw "SyntaxError: invalid syntax";}
  var r=expr();
  if(p<t.length)throw "SyntaxError: invalid syntax";
  return {v:r.v,f:r.f,printed:printed,ids:ids,ops:t.filter(function(x){return x.k==="o";}).map(function(x){return x.v;})};
}
function pyShow(r){
  if(!r.f)return String(r.v);
  var s=String(r.v);
  return s.indexOf(".")<0&&s.indexOf("e")<0?s+".0":s;
}

/* ===== Race content ===== */
var STARTER=[
  {q:"Warm-up 1: Which line prints the sum of 7 and 5?",opts:["print(7 + 5)","print(\"7 + 5\")","print(7 5)","sum 7 + 5"],a:0,why:"print( ) shows the answer and + adds."},
  {q:"Warm-up 2: What will Python print?",code:"print(10 / 4)",opts:["2","2.5","6","40"],a:1,why:"/ divides and gives a decimal answer."}
];
var PLENARY=[
  {q:"Final stretch 1: Which symbol does Python use to multiply?",opts:["x","×","*","."],a:2,why:"Python uses * for multiplication."},
  {q:"Final stretch 2: What will Python print?",code:"print(10 + 2 * 3)",opts:["36","15","16","18"],a:2,why:"* is done before +, just like BODMAS."}
];
var LAPS=[
 {title:"Lap 1 · Sum and Difference",lanes:[
   {type:"pick",text:"This line must print the sum of 25 and 40. Pick the missing operator.",pre:"print(",post:")",l:"25",r:"40",a:"+",hint:"Sum means putting two numbers together."},
   {type:"expr",text:"Type the Python code to print the sum of 25 and 40.",val:65,need:["+"],print:true,hint:"Start with print( and put the calculation inside the brackets."},
   {type:"expr",text:"These variables are already stored. Type the code to print the change (paid minus price).",setup:"paid = 500\nprice = 365",env:{paid:500,price:365},vars:["paid","price"],val:135,need:["-"],print:true,hint:"Use the variable names inside print( ), not the numbers."}]},
 {title:"Lap 2 · Product and Share",lanes:[
   {type:"pick",text:"4 friends share an AED 150 bill equally. Pick the operator that prints each friend's share.",pre:"print(",post:")",l:"150",r:"4",a:"/",hint:"Splitting into equal parts."},
   {type:"expr",text:"130 students each buy an AED 25 Global Village ticket. Type the code to print the total cost.",val:3250,need:["*"],print:true,hint:"Same price, many times."},
   {type:"expr",text:"UAE flags are shared equally by the students. Type the code to print each student's share.",setup:"total = 975\nstudents = 130",env:{total:975,students:130},vars:["total","students"],val:7.5,need:["/"],print:true,hint:"Use the variable names. Which operator splits into equal parts?"}]},
 {title:"Lap 3 · Order of Operations",lanes:[
   {type:"mcq",text:"What will Python print?",code:"print(2 + 3 * 4)",opts:["20","14","24","9"],a:1,hint:"Which operator does Python do first?"},
   {type:"expr",text:"Bug fix! This should print the average of three scores but prints 206.67. Fix it.",show:"print(85 + 90 + 95 / 3)",val:90,need:["(","/"],print:true,hint:"Python divides before it adds. What makes it add first?"},
   {type:"expr",text:"You buy 3 shirts at AED 60 each and 2 caps at AED 25 each, and pay with AED 500. Type ONE line of code to print your change.",val:270,need:["*","-"],print:true,hint:"Both costs must be taken away from 500."}]}
];
var LANEINFO=[["🚗","Cruise",6],["🏎️","Speed",10],["🚀","Turbo",14]];
var CARS=["🏎️","🚗","🚙","🚕","🚓","🚒","🚜","🛵"];
var STEPS=7, UNLOCK=2, CH_PTS=8;
function rnd(n){return Math.floor(Math.random()*n);}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* random "what will Python print" question – different for every student */
function makeMcq(){
  var a=2+rnd(8),b=2+rnd(8),c=2+rnd(5),t=rnd(5),ex,ans,bad,dec=false;
  if(t===0){ex=a+" + "+b+" * "+c;ans=a+b*c;bad=[(a+b)*c,a*b+c];}
  else if(t===1){ex=a+" * "+b+" - "+(c-1);ans=a*b-(c-1);bad=[a*b+(c-1),a+b-(c-1)];}
  else if(t===2){ex="("+a+" + "+b+") * "+c;ans=(a+b)*c;bad=[a+b*c,a*b+c];}
  else if(t===3){ex=(b*c)+" / "+c+" + "+a;ans=b+a;bad=[];dec=true;}
  else{var x=a*b+5+rnd(20);ex=x+" - "+a+" * "+b;ans=x-a*b;bad=[(x-a)*b,x-a+b];}
  var right=dec?ans+".0":String(ans),opts=[right];
  if(dec)opts.push(String(ans));
  bad.concat([ans+1,ans-1,ans+2,ans+10,ans+3]).forEach(function(v){var o=dec?v+".0":String(v);if(v>=0&&opts.length<4&&opts.indexOf(o)<0)opts.push(o);});
  return {ex:ex,right:right,opts:shuffle(opts)};
}
/* random challenge after the finish line – different for every student */
function gen(){
  var k=rnd(6),a=10+rnd(80),b=2+rnd(8),w=[["sum","+",a+b],["difference","-",a-b],["product","*",a*b]][rnd(3)];
  if(k===0)return {type:"expr",text:"Type the Python code to print the "+w[0]+" of "+a+" and "+b+".",val:w[2],need:[w[1]],print:true,hint:"Start with print( and put the calculation inside the brackets."};
  if(k===1){var nm=[["a","b"],["x","y"],["num1","num2"]][rnd(3)],env={};env[nm[0]]=a;env[nm[1]]=b;
    return {type:"expr",text:"These variables are already stored. Type the code to print their "+w[0]+".",setup:nm[0]+" = "+a+"\n"+nm[1]+" = "+b,env:env,vars:nm,val:w[2],need:[w[1]],print:true,hint:"Use the variable names inside print( ), not the numbers."};}
  if(k===2){var n=20+rnd(60),p=5*(1+rnd(9));
    return {type:"expr",text:n+" students each pay AED "+p+" for a school trip. Type the code to print the total amount.",val:n*p,need:["*"],print:true,hint:"Same amount, many times."};}
  if(k===3){var f=2+rnd(7),each=5*(2+rnd(15));
    return {type:"expr",text:f+" friends share AED "+(f*each)+" equally. Type the code to print each friend's share.",val:each,need:["/"],print:true,hint:"Splitting into equal parts."};}
  if(k===4){var x=60+rnd(40),y=60+rnd(40),z=60+rnd(40);
    return {type:"expr",text:"Your marks are "+x+", "+y+" and "+z+". Type ONE line of code to print the average.",val:(x+y+z)/3,need:["(","/"],print:true,hint:"Add all three first – what makes Python add before it divides?"};}
  var m=makeMcq();
  return {type:"mcq",text:"What will Python print?",code:"print("+m.ex+")",opts:m.opts,a:m.opts.indexOf(m.right),hint:"Brackets first, then * and /, then + and −."};
}

var S=null, KEY="pgp_run3", SALT="sis-juwaiza-gp", board=[], online=true, timer=null, busy=false, again=false, resets=0, note="";
function h(str){var x=5381;for(var i=0;i<str.length;i++)x=((x<<5)+x+str.charCodeAt(i))|0;return Math.abs(x);}
function save(){try{var j=JSON.stringify(S);sessionStorage.setItem(KEY,j+"|"+h(j+SALT));}catch(e){}}
function load(){try{var raw=sessionStorage.getItem(KEY);if(!raw)return;var i=raw.lastIndexOf("|"),j=raw.slice(0,i);
  if(String(h(j+SALT))===raw.slice(i+1))S=JSON.parse(j);else sessionStorage.removeItem(KEY);}catch(e){}}
function netPts(){return Math.max(0,S.pts-5*S.pen);}
function addPts(n){S.pts+=n;save();paint();sync();}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function ord(n){return n+(n%10===1&&n!==11?"st":n%10===2&&n!==12?"nd":n%10===3&&n!==13?"rd":"th");}

/* ===== Live race link ===== */
function api(params){
  var qs=Object.keys(params).map(function(k){return k+"="+encodeURIComponent(params[k]);}).join("&");
  return fetch(API_URL+"?"+qs,{redirect:"follow"}).then(function(r){return r.json();});
}
function applyJoin(r){
  S.id=r.id||S.id;S.rid=r.rid;if(r.name)S.name=r.name;
  if(typeof r.pen==="number")S.pen=r.pen;
  if(typeof r.ls==="number"&&r.ls>S.ln)S.ln=r.ls;
  if(r.step>S.done||r.pts>S.pts){               // coming back: carry on from where the race was left
    S.done=Math.max(S.done,r.step||0);S.pts=Math.max(S.pts,r.pts||0);S.open=false;S.lane=-1;S.chest=false;
    S.stage=S.done>=STEPS?"finish":"race";
  }
  if(r.status!=="live"&&S.done===0&&S.pts===0)S.stage="lobby";
  if(r.board)board=r.board;
  save();
}
function sync(){
  if(!API_URL||!S)return;
  if(busy){again=true;return;}
  clearTimeout(timer);busy=true;again=false;
  var q={action:"sync",id:S.id,rid:S.rid,step:S.done,pts:S.pts}, L=S.q[0];
  if(L){q.ln=L.n;q.ls=L.st;q.ll=L.lv;q.lq=L.q;q.la=L.a;q.lt=L.t;q.lp=L.p;}
  api(q).then(function(r){
    online=true;
    if(!S)return;
    if(r.reset){if(++resets>=2){signOut("Your teacher started a new race. Please sign in again.");}return;}
    resets=0;
    if(r.rejoin){                                  // the sheet lost this driver: put them back with their progress
      return api({action:"join",restore:1,id:S.id,name:S.name,cls:S.cls,div:S.div,car:S.car,step:S.done,pts:S.pts}).then(function(j){if(S&&j.ok)applyJoin(j);});
    }
    if(!r.ok)return;
    if(r.board)board=r.board;
    if(typeof r.ack==="number"){S.q=S.q.filter(function(x){return x.n>r.ack;});if(S.q.length)again=true;save();}
    if(typeof r.pen==="number"&&r.pen!==S.pen){S.pen=r.pen;save();}
    if(S.stage==="lobby"&&r.status==="live"){S.stage=S.done>=STEPS?"finish":"race";save();route();}
    else if(S.stage==="finish")finishInfo();
    paint();
  }).catch(function(){online=false;}).then(function(){
    busy=false;
    if(!S)return;
    if(again)sync();
    else timer=setTimeout(sync,(S.stage==="lobby"?3000:S.stage==="finish"?8000:5000)+Math.random()*1500);
  });
}
function drawMap(){
  if(!API_URL)return;
  var me=-1;board.forEach(function(b,i){if(b.me)me=i;});
  var rows=board.slice(0,6).map(function(b,i){return rowHtml(b,i);}).join("");
  if(me>=6)rows+='<div class="sep"></div>'+rowHtml(board[me],me);
  $("map").innerHTML='<h3>🗺️ Live road map</h3><small>'+board.length+' driver'+(board.length===1?"":"s")+' on the track</small>'+(rows||'<p>Waiting for drivers…</p>');
}
function rowHtml(b,i){

    if(T.setup)html+='<div class="code">'+esc(T.setup).replace(/\n/g,"<br>")+'</div>';
    if(T.show)html+='<div class="code">'+esc(T.show)+'</div>';
    html+='<div class="inp"><input id="ex" autocomplete="off" spellcheck="false" placeholder="type your Python code here"'+(T.show?' value="'+esc(T.show)+'"':'')+'><button id="run">Run ▶</button></div><div class="code" id="out"><span class="p">&gt;&gt;&gt;</span></div>';
  }
  html+='<div class="msg" id="m"></div><div id="hb">'+(S.hint?'<div class="hint">💡 '+esc(T.hint)+'</div>':'')+'</div><div class="tools">'+
    (S.hint?'':'<button class="light" id="hint">💡 Hint (−2)</button>')+extraBtn+'</div>';
  view.innerHTML=html;
  var m=$("m"), qText=T.text+(T.setup?" ["+T.setup.replace(/\n/g,"; ")+"]":"")+(T.code?" "+T.code:"")+(T.show?" "+T.show:"")+(T.type==="pick"?" "+(T.pre||"")+T.l+" ? "+T.r+(T.post||""):"");
  function win(ans){info.q=qText;info.a=ans;solved(S.worth,info,m);}
  function miss(txt){S.tries++;S.worth=Math.max(3,S.worth-2);save();m.className="msg no";m.textContent=txt;bump();}
  if(T.type==="pick"){
    Array.prototype.forEach.call(view.querySelectorAll(".ops button"),function(b){b.onclick=function(){
      if(b.dataset.o===T.a)win(b.dataset.o);else{b.disabled=true;b.style.opacity=.4;miss("In Python, "+T.l+" "+b.dataset.o+" "+T.r+" gives "+pyShow(pyEval(T.l+b.dataset.o+T.r))+". Try another.");}};});
  }else if(T.type==="mcq"){
    Array.prototype.forEach.call(view.querySelectorAll(".opts button"),function(b){b.onclick=function(){
      if(+b.dataset.k===T.a)win(T.opts[T.a]);else{b.disabled=true;b.style.opacity=.4;miss("Not quite – try another.");}};});
  }else{
    var run=function(){
      var src=$("ex").value,out=$("out");
      try{
        var r=pyEval(src,T.env);
        out.innerHTML='<span class="p">&gt;&gt;&gt;</span> '+esc(src)+'<br><span class="o">'+pyShow(r)+'</span>';
        var lack=T.need.filter(function(o){return r.ops.indexOf(o)<0;});
        var noVar=(T.vars||[]).filter(function(v){return r.ids.indexOf(v)<0;});
        if(Math.abs(r.v-T.val)>1e-9)miss("Python ran it, but that is not the answer yet.");
        else if(lack.length)miss("Right number – but let Python do the work using "+lack.join(" and ")+".");
        else if(noVar.length)miss("Right number – now use the variable "+noVar.join(" and ")+" instead of typing the number.");
        else if(T.print&&!r.printed)miss("Almost! The task says print it – put your calculation inside print( ).");
        else win(src);
      }catch(e){out.innerHTML='<span class="p">&gt;&gt;&gt;</span> '+esc(src)+'<br><span class="e">'+esc(e)+'</span>';S.tries++;save();m.className="msg no";m.textContent="Fix the error and run again.";}
    };
    $("run").onclick=run;$("ex").onkeydown=function(e){if(e.key==="Enter")run();};$("ex").focus();
  }
  if($("hint"))$("hint").onclick=function(){S.hint=true;S.worth=Math.max(3,S.worth-2);save();$("hb").innerHTML='<div class="hint">💡 '+esc(T.hint)+'</div>';this.remove();};
  if($("chg"))$("chg").onclick=extraFn;
}
function finish(){
  view.innerHTML='<div class="big">🏁🏆</div><h2 style="text-align:center">Finished, '+esc(S.name)+'!</h2><div id="fi"></div>'+
    '<p style="text-align:center">Keep racing for more points – every challenge is different!</p>'+
    '<div class="tools" style="justify-content:center"><button id="cz">⚡ Enter the Challenge Zone</button></div>';
  $("cz").onclick=function(){S.stage="challenge";save();route();};
  finishInfo();
  if(!S.party){S.party=true;save();confetti();}
}
function finishInfo(){
  if(!$("fi"))return;
  var me=-1;board.forEach(function(b,i){if(b.me&&b.fin)me=i;});
  var secs=me>=0?board[me].t:Math.round((S.t1-S.t0)/1000);
  $("fi").innerHTML='<div class="stats"><div><b>'+(me>=0?ord(me+1):"–")+'</b>position</div><div><b>'+netPts()+'</b>points</div><div><b>'+Math.floor(secs/60)+' min '+(secs%60)+' s</b>race time</div></div>'+
    (S.pen?'<p style="text-align:center;color:#e0245e;font-weight:700">Noise penalties: '+S.pen+'</p>':'');
}
function confetti(){
  var cv=$("fx"),cx=cv.getContext("2d"),W=cv.width=innerWidth,H=cv.height=innerHeight,col=["#ffc928","#ff4f8b","#22c36b","#2d9cff","#ffffff","#8b5cf6"],P=[],end=Date.now()+5000;
  for(var i=0;i<140;i++)P.push({x:Math.random()*W,y:Math.random()*-H,s:6+Math.random()*7,v:2+Math.random()*3,a:Math.random()*6,c:col[i%6]});
  (function f(){
    cx.clearRect(0,0,W,H);
    if(Date.now()>end||!S)return;
    P.forEach(function(p){p.y+=p.v;p.a+=.07;p.x+=Math.sin(p.a)*1.5;if(p.y>H){p.y=-10;p.x=Math.random()*W;}
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);cx.restore();});
    requestAnimationFrame(f);
  })();
}

$("outBtn").onclick=function(){signOut("");};
load();route();sync();
})();
</script>
